# Application Gateway Routing Configuration
# This file contains the routing rules for NBRLY tenant
# Domain: nbrly-dev.astrapia.io
# Path-based routing: /app1/* -> nbapp1, /app2/* -> nbapp2

apiVersion: network.azure.com/v1
kind: ApplicationGatewayConfiguration
metadata:
  name: nbrly-routing-config
  resourceGroup: rg-astrapia-dev
spec:
  applicationGateway: agw-astrapia-dev
  
  # Backend Address Pools
  backendAddressPools:
    - name: pool-nbrly-app1
      backendAddresses:
        - fqdn: "#{NBRLY_NBAPP1_FQDN}#"  # Will be replaced with actual Container App FQDN
    - name: pool-nbrly-app2
      backendAddresses:
        - fqdn: "#{NBRLY_NBAPP2_FQDN}#"  # Will be replaced with actual Container App FQDN

  # Backend HTTP Settings
  backendHttpSettingsCollection:
    - name: settings-nbrly-app1
      port: 443
      protocol: Https
      requestTimeout: 30
      probe:
        name: probe-nbrly-app1
      pickHostNameFromBackendAddress: true
      
    - name: settings-nbrly-app2
      port: 443
      protocol: Https
      requestTimeout: 30
      probe:
        name: probe-nbrly-app2
      pickHostNameFromBackendAddress: true

  # Health Probes
  probes:
    - name: probe-nbrly-app1
      protocol: Https
      path: /app1/health
      interval: 30
      timeout: 30
      unhealthyThreshold: 3
      pickHostNameFromBackendHttpSettings: true
      match:
        statusCodes:
          - "200-399"
    
    - name: probe-nbrly-app2
      protocol: Https
      path: /app2/health
      interval: 30
      timeout: 30
      unhealthyThreshold: 3
      pickHostNameFromBackendHttpSettings: true
      match:
        statusCodes:
          - "200-399"

  # HTTP Listeners
  httpListeners:
    - name: listener-nbrly
      frontendIPConfiguration:
        name: appGatewayFrontendIP
      frontendPort:
        name: appGatewayFrontendPort
      protocol: Http
      hostName: nbrly-dev.astrapia.io

  # URL Path Maps (Path-based routing)
  urlPathMaps:
    - name: path-map-nbrly
      defaultBackendAddressPool:
        name: pool-nbrly-app1  # Default to app1
      defaultBackendHttpSettings:
        name: settings-nbrly-app1
      pathRules:
        - name: rule-nbrly-app2
          paths:
            - "/app2/*"
          backendAddressPool:
            name: pool-nbrly-app2
          backendHttpSettings:
            name: settings-nbrly-app2

  # Request Routing Rules
  requestRoutingRules:
    - name: rule-nbrly
      ruleType: PathBasedRouting
      httpListener:
        name: listener-nbrly
      urlPathMap:
        name: path-map-nbrly
      priority: 100