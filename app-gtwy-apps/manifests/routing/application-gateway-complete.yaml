# Complete Application Gateway Configuration
# This file contains the full Application Gateway setup including both tenants

apiVersion: network.azure.com/v1
kind: ApplicationGateway
metadata:
  name: agw-astrapia-dev
  resourceGroup: rg-astrapia-dev
  location: East US
spec:
  sku:
    name: WAF_v2
    tier: WAF_v2
    capacity: 2

  # Gateway IP Configuration
  gatewayIPConfigurations:
    - name: appGatewayIpConfig
      subnet:
        id: /subscriptions/{subscription-id}/resourceGroups/rg-astrapia-dev/providers/Microsoft.Network/virtualNetworks/vnet-astrapia-dev/subnets/snet-appgw-dev

  # Frontend IP Configurations
  frontendIPConfigurations:
    - name: appGatewayFrontendIP
      publicIPAddress:
        id: /subscriptions/{subscription-id}/resourceGroups/rg-astrapia-dev/providers/Microsoft.Network/publicIPAddresses/pip-agw-astrapia-dev

  # Frontend Ports
  frontendPorts:
    - name: appGatewayFrontendPort
      port: 80
    - name: appGatewayFrontendPortHttps
      port: 443

  # Backend Address Pools - NBRLY Tenant
  backendAddressPools:
    - name: pool-nbrly-app1
      backendAddresses:
        - fqdn: "#{NBRLY_NBAPP1_FQDN}#"
    - name: pool-nbrly-app2
      backendAddresses:
        - fqdn: "#{NBRLY_NBAPP2_FQDN}#"
    
    # Backend Address Pools - BLOOM Tenant
    - name: pool-bloom-app1
      backendAddresses:
        - fqdn: "#{BLOOM_BMAPP1_FQDN}#"
    - name: pool-bloom-app2
      backendAddresses:
        - fqdn: "#{BLOOM_BMAPP2_FQDN}#"

  # Backend HTTP Settings - NBRLY Tenant
  backendHttpSettingsCollection:
    - name: settings-nbrly-app1
      port: 443
      protocol: Https
      requestTimeout: 30
      probe:
        name: probe-nbrly-app1
      pickHostNameFromBackendAddress: true
      
    - name: settings-nbrly-app2
      port: 443
      protocol: Https
      requestTimeout: 30
      probe:
        name: probe-nbrly-app2
      pickHostNameFromBackendAddress: true

    # Backend HTTP Settings - BLOOM Tenant
    - name: settings-bloom-app1
      port: 443
      protocol: Https
      requestTimeout: 30
      probe:
        name: probe-bloom-app1
      pickHostNameFromBackendAddress: true
      
    - name: settings-bloom-app2
      port: 443
      protocol: Https
      requestTimeout: 30
      probe:
        name: probe-bloom-app2
      pickHostNameFromBackendAddress: true

  # Health Probes - NBRLY Tenant
  probes:
    - name: probe-nbrly-app1
      protocol: Https
      path: /app1/health
      interval: 30
      timeout: 30
      unhealthyThreshold: 3
      pickHostNameFromBackendHttpSettings: true
      match:
        statusCodes:
          - "200-399"
    
    - name: probe-nbrly-app2
      protocol: Https
      path: /app2/health
      interval: 30
      timeout: 30
      unhealthyThreshold: 3
      pickHostNameFromBackendHttpSettings: true
      match:
        statusCodes:
          - "200-399"

    # Health Probes - BLOOM Tenant
    - name: probe-bloom-app1
      protocol: Https
      path: /app1/health
      interval: 30
      timeout: 30
      unhealthyThreshold: 3
      pickHostNameFromBackendHttpSettings: true
      match:
        statusCodes:
          - "200-399"
    
    - name: probe-bloom-app2
      protocol: Https
      path: /app2/health
      interval: 30
      timeout: 30
      unhealthyThreshold: 3
      pickHostNameFromBackendHttpSettings: true
      match:
        statusCodes:
          - "200-399"

  # HTTP Listeners
  httpListeners:
    - name: listener-nbrly
      frontendIPConfiguration:
        name: appGatewayFrontendIP
      frontendPort:
        name: appGatewayFrontendPort
      protocol: Http
      hostName: nbrly-dev.astrapia.io

    - name: listener-bloom
      frontendIPConfiguration:
        name: appGatewayFrontendIP
      frontendPort:
        name: appGatewayFrontendPort
      protocol: Http
      hostName: bloom-dev.astrapia.io

  # URL Path Maps - NBRLY Tenant
  urlPathMaps:
    - name: path-map-nbrly
      defaultBackendAddressPool:
        name: pool-nbrly-app1
      defaultBackendHttpSettings:
        name: settings-nbrly-app1
      pathRules:
        - name: rule-nbrly-app2
          paths:
            - "/app2/*"
          backendAddressPool:
            name: pool-nbrly-app2
          backendHttpSettings:
            name: settings-nbrly-app2

    # URL Path Maps - BLOOM Tenant
    - name: path-map-bloom
      defaultBackendAddressPool:
        name: pool-bloom-app1
      defaultBackendHttpSettings:
        name: settings-bloom-app1
      pathRules:
        - name: rule-bloom-app2
          paths:
            - "/app2/*"
          backendAddressPool:
            name: pool-bloom-app2
          backendHttpSettings:
            name: settings-bloom-app2

  # Request Routing Rules
  requestRoutingRules:
    - name: rule-nbrly
      ruleType: PathBasedRouting
      httpListener:
        name: listener-nbrly
      urlPathMap:
        name: path-map-nbrly
      priority: 100

    - name: rule-bloom
      ruleType: PathBasedRouting
      httpListener:
        name: listener-bloom
      urlPathMap:
        name: path-map-bloom
      priority: 200

  # Web Application Firewall Configuration
  webApplicationFirewallConfiguration:
    enabled: true
    firewallMode: Prevention
    ruleSetType: OWASP
    ruleSetVersion: "3.2"
    disabledRuleGroups: []
    exclusions: []