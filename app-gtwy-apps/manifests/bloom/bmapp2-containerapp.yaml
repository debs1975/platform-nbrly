apiVersion: app/v1beta1
kind: ContainerApp
metadata:
  name: ca-bloom-bmapp2-dev
  resourceGroup: rg-astrapia-dev
spec:
  environmentId: /subscriptions/984059e7-2907-4273-8569-703dddc5adfa/resourceGroups/rg-astrapia-dev/providers/Microsoft.App/managedEnvironments/cae-bloom-dev
  identity:
    type: UserAssigned
    userAssignedIdentities:
      /subscriptions/984059e7-2907-4273-8569-703dddc5adfa/resourceGroups/rg-astrapia-dev/providers/Microsoft.ManagedIdentity/userAssignedIdentities/bloom-dev-uami: {}
  configuration:
    registries:
      - server: astradevacr.azurecr.io
        identity: /subscriptions/984059e7-2907-4273-8569-703dddc5adfa/resourceGroups/rg-astrapia-dev/providers/Microsoft.ManagedIdentity/userAssignedIdentities/bloom-dev-uami
    ingress:
      external: false
      targetPort: 8000
      transport: http
      allowInsecure: false
    secrets:
      - name: db-connection-string
        keyVaultUrl: https://astradeveastuskv.vault.azure.net/secrets/bloom-psql-connection-string
        identity: /subscriptions/984059e7-2907-4273-8569-703dddc5adfa/resourceGroups/rg-astrapia-dev/providers/Microsoft.ManagedIdentity/userAssignedIdentities/bloom-dev-uami
  template:
    containers:
      - name: bmapp2
        image: astradevacr.azurecr.io/astradevacr.azurecr.io/bloom/bmapp2:latest
        env:
          - name: ENVIRONMENT
            value: "dev"
          - name: ROOT_PATH
            value: "/app2"
          - name: APP_NAME
            value: "ca-bloom-bmapp2-dev"
          - name: TENANT
            value: "bloom"
          - name: APP_TYPE
            value: "bmapp2"
          - name: AZURE_CLIENT_ID
            value: "#{BLOOM_UAMI_CLIENT_ID}#"
          - name: DATABASE_URL
            secretRef: db-connection-string
          - name: PORT
            value: "8000"
        resources:
          cpu: 0.5
          memory: 1.0Gi
        probes:
          - type: Liveness
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          - type: Readiness
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
    scale:
      minReplicas: 1
      maxReplicas: 3
      rules:
        - name: http-scaling
          http:
            metadata:
              concurrentRequests: "100"
