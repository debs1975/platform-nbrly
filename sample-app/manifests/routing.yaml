# Container Apps Environment HTTP Routing Configuration
# This file defines rule-based routing for multiple container apps
# Docs: https://learn.microsoft.com/en-us/azure/container-apps/rule-based-routing

routes:
  # Route /app1 prefix to the main API container app
  - match:
      prefix: /app1
    action:
      prefixRewrite: /app1
    target:
      containerApp: "{{PROJECT_NAME}}-{{ENV}}-eastus-api-ca"
  
  # Route /app2 prefix to the second API container app
  - match:
      prefix: /app2
    action:
      prefixRewrite: /app2
    target:
      containerApp: "{{PROJECT_NAME}}-{{ENV}}-eastus-api2-ca"

# Notes:
# - All requests to the environment FQDN are matched against these rules
# - Routes are evaluated in order (first match wins)
# - prefixRewrite allows you to modify the path sent to the target app
# - Container apps must exist in the same environment
# - Both apps use their respective root paths (/app1 and /app2)
# - Container app names updated to comply with 32-character limit:
#   - App1: {{PROJECT_NAME}}-{{ENV}}-eastus-api-ca (e.g., nbrly-dev-eastus-api-ca)
#   - App2: {{PROJECT_NAME}}-{{ENV}}-eastus-api2-ca (e.g., nbrly-dev-eastus-api2-ca)
