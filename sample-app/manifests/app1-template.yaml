# ============================================================================
# Azure Container App Template - App1
# ============================================================================
# Template file with placeholders for any environment
# Use this as a base for generating environment-specific deployments
#
# Placeholders:
#   {{SUBSCRIPTION_ID}}       - Azure subscription ID
#   {{RESOURCE_GROUP}}        - Resource group name
#   {{CAE_NAME}}              - Container Apps Environment name
#   {{ACR_NAME}}              - Azure Container Registry name
#   {{UAMI_RESOURCE_ID}}      - User-assigned managed identity full resource ID
#   {{KV_NAME}}               - Key Vault name
#   {{IMAGE_TAG}}             - Container image tag
#   {{ENVIRONMENT}}           - Environment name (dev, staging, prod)
#   {{PROJECT_NAME}}          - Project name
#   {{CONTAINER_CPU}}         - CPU allocation
#   {{CONTAINER_MEMORY}}      - Memory allocation
#   {{CONTAINER_PORT}}        - Container port
#   {{MIN_REPLICAS}}          - Minimum replicas
#   {{MAX_REPLICAS}}          - Maximum replicas
#   {{HTTP_CONCURRENT_REQUESTS}} - Concurrent requests threshold
#   {{LOG_LEVEL}}             - Application log level
#   {{LIVENESS_PATH}}         - Liveness probe path
#   {{LIVENESS_INITIAL_DELAY}} - Liveness probe initial delay
#   {{LIVENESS_PERIOD}}       - Liveness probe period
#   {{LIVENESS_TIMEOUT}}      - Liveness probe timeout
#   {{LIVENESS_FAILURE_THRESHOLD}} - Liveness probe failure threshold
#   {{READINESS_PATH}}        - Readiness probe path
#   {{READINESS_INITIAL_DELAY}} - Readiness probe initial delay
#   {{READINESS_PERIOD}}      - Readiness probe period
#   {{READINESS_TIMEOUT}}     - Readiness probe timeout
#   {{READINESS_FAILURE_THRESHOLD}} - Readiness probe failure threshold
#   {{STARTUP_PATH}}          - Startup probe path
#   {{STARTUP_INITIAL_DELAY}} - Startup probe initial delay
#   {{STARTUP_PERIOD}}        - Startup probe period
#   {{STARTUP_TIMEOUT}}       - Startup probe timeout
#   {{STARTUP_FAILURE_THRESHOLD}} - Startup probe failure threshold
# ============================================================================

properties:
  environmentId: /subscriptions/{{SUBSCRIPTION_ID}}/resourceGroups/{{RESOURCE_GROUP}}/providers/Microsoft.App/managedEnvironments/{{CAE_NAME}}
  
  configuration:
    activeRevisionsMode: single
    
    ingress:
      external: false
      targetPort: {{CONTAINER_PORT}}
      transport: http
      allowInsecure: false
      traffic:
        - latestRevision: true
          weight: 100
    
    registries:
      - server: {{ACR_NAME}}.azurecr.io
        identity: {{UAMI_RESOURCE_ID}}
    
    secrets:
      - name: postgres-connection-string
        keyVaultUrl: https://{{KV_NAME}}.vault.azure.net/secrets/postgres-connection-string
        identity: {{UAMI_RESOURCE_ID}}
      
      - name: api-secret-key
        keyVaultUrl: https://{{KV_NAME}}.vault.azure.net/secrets/api-secret-key
        identity: {{UAMI_RESOURCE_ID}}
  
  template:
    containers:
      - name: app1
        image: {{ACR_NAME}}.azurecr.io/app1:{{IMAGE_TAG}}
        resources:
          cpu: {{CONTAINER_CPU}}
          memory: {{CONTAINER_MEMORY}}
        
        env:
          - name: ENVIRONMENT
            value: {{ENVIRONMENT}}
          
          - name: PROJECT_NAME
            value: {{PROJECT_NAME}}
          
          - name: APP_NAME
            value: app1
          
          - name: DATABASE_URL
            secretRef: postgres-connection-string
          
          - name: SECRET_KEY
            secretRef: api-secret-key
          
          - name: LOG_LEVEL
            value: {{LOG_LEVEL}}
          
          - name: PORT
            value: "{{CONTAINER_PORT}}"
        
        probes:
          - type: liveness
            httpGet:
              path: {{LIVENESS_PATH}}
              port: {{CONTAINER_PORT}}
              scheme: HTTP
            initialDelaySeconds: {{LIVENESS_INITIAL_DELAY}}
            periodSeconds: {{LIVENESS_PERIOD}}
            timeoutSeconds: {{LIVENESS_TIMEOUT}}
            successThreshold: 1
            failureThreshold: {{LIVENESS_FAILURE_THRESHOLD}}
          
          - type: readiness
            httpGet:
              path: {{READINESS_PATH}}
              port: {{CONTAINER_PORT}}
              scheme: HTTP
            initialDelaySeconds: {{READINESS_INITIAL_DELAY}}
            periodSeconds: {{READINESS_PERIOD}}
            timeoutSeconds: {{READINESS_TIMEOUT}}
            successThreshold: 1
            failureThreshold: {{READINESS_FAILURE_THRESHOLD}}
          
          - type: startup
            httpGet:
              path: {{STARTUP_PATH}}
              port: {{CONTAINER_PORT}}
              scheme: HTTP
            initialDelaySeconds: {{STARTUP_INITIAL_DELAY}}
            periodSeconds: {{STARTUP_PERIOD}}
            timeoutSeconds: {{STARTUP_TIMEOUT}}
            successThreshold: 1
            failureThreshold: {{STARTUP_FAILURE_THRESHOLD}}
    
    scale:
      minReplicas: {{MIN_REPLICAS}}
      maxReplicas: {{MAX_REPLICAS}}
      
      rules:
        - name: http-rule
          http:
            metadata:
              concurrentRequests: "{{HTTP_CONCURRENT_REQUESTS}}"

identity:
  type: UserAssigned
  userAssignedIdentities:
    {{UAMI_RESOURCE_ID}}: {}

tags:
  Environment: {{ENVIRONMENT}}
  Project: {{PROJECT_NAME}}
  Application: app1
  ManagedBy: YAML-Deployment
